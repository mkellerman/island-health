<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.1.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega/v5.json",
  "description": "A top-k bar chart ranking film directors by revenue.",
  "width": 500,
  "height": 410,
  "padding": 5,
  "autosize": "fit",
  "signals": [
    // {
    //   "name": "k",
    //   "value": 20,
    //   "bind": {"input": "range", "min": 10, "max": 30, "step": 1}
    // },
    {
      "name": "op",
      "value": "average",
      "bind": {"input": "select", "options": ["average", "median", "sum"]}
    },
    {
      "name": "label",
      "value": {"average": "Average", "median": "Median", "sum": "Total"}
    }
  ],
  "title": {
    "text": {"signal": "'Top Wait Times in Island Health (Minutes)'"},
    "anchor": "start",
    "frame": "group"
  },
  "data": [
    {
      "name": "tokens",
      "url": "healthData.json",
      "transform": [
        {
          "type": "filter",
          "expr": "datum.name != null && datum['wait-time-min'] != null"
        },
        {
          "type": "aggregate",
          "groupby": ["name"],
          "ops": [{"signal": "op"}],
          "fields": ["wait-time-min"],
          "as": ["wait-time-min"]
        },
        {
          "type": "window",
          "sort": {"field": "wait-time-min", "order": "descending"},
          "ops": ["row_number"],
          "as": ["rank"]
        },
        // {"type": "filter", "expr": "datum.rank <= k"}
      ]
    }
  ],
  "marks": [
    {
      "type": "rect",
      "from": {"data": "tokens"},
      "encode": {
        "update": {
          "x": {"scale": "x", "value": 0},
          "x2": {"scale": "x", "field": "wait-time-min"},
          "y": {"scale": "y", "field": "name"},
          "height": {"scale": "y", "band": 1}
        }
      }
    }
  ],
  "scales": [
    {
      "name": "x",
      "type": "linear",
      "domain": {"data": "tokens", "field": "wait-time-min"},
      "range": "width",
      "nice": true
    },
    {
      "name": "y",
      "type": "band",
      "domain": {
        "data": "tokens",
        "field": "name",
        "sort": {"op": "max", "field": "wait-time-min", "order": "descending"}
      },
      "range": "height",
      "padding": 0.1
    }
  ],
  "axes": [
    {"scale": "x", "orient": "bottom", "format": ",d", "tickCount": 5},
    {"scale": "y", "orient": "left"}
  ],
  "config": {}
};
    vegaEmbed("#vis", spec, {mode: "vega"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
